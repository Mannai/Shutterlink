<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 470" width="770" height="470" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .menu { fill: #f9f9f9; stroke: #dcdcdc; }
    .hover { fill: #eaeaea; }
    .text { fill: #1a1a1a; }
    .dim { fill: #8a8a8a; }
    .sep { stroke: #e3e3e3; }
    .check { stroke: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .menu { fill: #2c2c2c; stroke: #454545; }
      .hover { fill: #3d3d3d; }
      .text { fill: #f3f3f3; }
      .dim { fill: #9d9d9d; }
      .sep { stroke: #444; }
      .check { stroke: #f3f3f3; }
    }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Main tray menu -->
  <rect class="menu" x="20" y="20" width="280" height="236" rx="8" filter="url(#shadow)"/>
  <text class="dim" x="44" y="44">Streaming 1920x1080 at 60 fps</text>
  <line class="sep" x1="28" y1="58.5" x2="292" y2="58.5"/>
  <text class="text" x="44" y="83" font-weight="600">Focus point…</text>
  <text class="text" x="44" y="113">Focus</text><text class="text" x="276" y="113">›</text>
  <text class="text" x="44" y="143">Exposure</text><text class="text" x="276" y="143">›</text>
  <rect class="hover" x="24" y="153" width="272" height="30" rx="4"/>
  <text class="text" x="44" y="173">Color</text><text class="text" x="276" y="173">›</text>
  <text class="text" x="44" y="203">Mirror image</text>
  <line class="sep" x1="28" y1="217.5" x2="292" y2="217.5"/>
  <text class="text" x="44" y="242">Exit</text>

  <!-- Color submenu -->
  <rect class="menu" x="296" y="149" width="240" height="68" rx="8" filter="url(#shadow)"/>
  <rect class="hover" x="300" y="153" width="232" height="30" rx="4"/>
  <text class="text" x="320" y="173">White balance</text><text class="dim" x="484" y="173" text-anchor="end">Auto</text><text class="text" x="512" y="173">›</text>
  <text class="text" x="320" y="203">Picture style</text><text class="dim" x="484" y="203" text-anchor="end">Standard</text><text class="text" x="512" y="203">›</text>

  <!-- White balance list -->
  <rect class="menu" x="532" y="149" width="218" height="308" rx="8" filter="url(#shadow)"/>
  <polyline class="check" points="547,167 551,172 559,162" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="text" x="572" y="173">Auto</text>
  <text class="text" x="572" y="203">Auto (white priority)</text>
  <text class="text" x="572" y="233">Daylight</text>
  <text class="text" x="572" y="263">Shade</text>
  <text class="text" x="572" y="293">Cloudy</text>
  <text class="text" x="572" y="323">Tungsten</text>
  <text class="text" x="572" y="353">Fluorescent</text>
  <text class="text" x="572" y="383">Flash</text>
  <text class="text" x="572" y="413">Custom</text>
  <text class="text" x="572" y="443">Kelvin</text>
</svg>
